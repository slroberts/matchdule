name: Daily GotSport Scraper

# This tells GitHub WHEN to run the script
on:
  schedule:
    # Runs at 9:00 UTC every day (5:00 AM EDT)
    - cron: '0 9 * * *'
  # This lets you click a button to run it manually anytime
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # 1. Grab your code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Matches a stable version

      # 3. Install Python packages from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Install Playwright browser (Chromium) and its system dependencies
      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      # 5. Run your scraper!
      - name: Run main.py
        env:
          # Pulls your secure keys from GitHub Secrets
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py
