name: GotSport Scraper

on:
  # ─────────────────────────────────────────────────────────────────────────
  # SCHEDULE PAUSED — GotSport is serving a CAPTCHA to automated requests.
  # Manual runs only for now ("Run workflow" button).
  #
  # To resume: wait a few days, confirm ONE manual run succeeds, then restore
  # this gentle schedule (same load as the original twice-a-day setup):
  #
  #   schedule:
  #     - cron: '30 11 * * *' # ~7:30 AM ET  — overnight changes
  #     - cron: '30 1 * * *'  # ~9:30 PM ET  — same-evening scores, after late games
  #
  # If even that hits the CAPTCHA, stop automated scraping and use a
  # sanctioned source (club/league export or a GotSport calendar feed).
  # ─────────────────────────────────────────────────────────────────────────
  workflow_dispatch:

# Never run two scrapes at once (both would upsert/prune the same rows).
concurrency:
  group: gotsport-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        working-directory: ./scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get Playwright version
        id: pw
        run: echo "version=$(pip show playwright | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browser)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run scraper
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        # Exit 2 = GotSport served a CAPTCHA (stop, don't retry) · Exit 1 = other failure
        run: python main.py
