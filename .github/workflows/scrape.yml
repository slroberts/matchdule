name: GotSport Scraper

on:
  schedule:
    - cron: '0 9 * * *' # ~5:00 AM ET daily — overnight changes, before morning games
    - cron: '30 1 * * *' # ~9:30 PM ET daily — after late games
  workflow_dispatch:

# Never run two scrapes at once (both would upsert/prune the same rows).
concurrency:
  group: gotsport-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Worst case with JS rendering: 2 teams × (3 attempts × 180 s + 15 s backoff) ≈ 19 min
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        working-directory: ./scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          # Flip to "false" if the match rows are in GotSport's page source (faster, far fewer credits)
          ZENROWS_JS_RENDER: 'true'
        # Exit 2 = hard block (bad key, no credits, persistent CAPTCHA) · Exit 1 = other failure
        run: python main.py
